# This repository gates its own Dependabot updates with depgate.
name: depgate

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: read

jobs:
  gate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
